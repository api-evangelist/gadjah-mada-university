x-operator: institution

summary: >-
  UGM publishes no versioning policy, no deprecation policy, no changelog and no status page for
  any of its machine-readable surfaces. Version information exists but only as a bare string:
  "UGM ID 2.0" in info.version, OAI-PMH protocolVersion 2.0 on both harvesting endpoints. There is
  no route by which a consumer would learn that something changed, and the /health endpoint - the
  one operational signal that does exist - reports its own version as the literal string "unknown".
  The most consequential lifecycle fact on the estate is that two of the three identity stacks are
  running software old enough to be a succession risk.

