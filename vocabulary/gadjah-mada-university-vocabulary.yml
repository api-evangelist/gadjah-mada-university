standard_vocabularies_in_use:
- vocabulary: OpenID Connect Core 1.0 claims
  used_in: UGM ID
  terms: [sub, iss, aud, exp, iat, auth_time, name, given_name, family_name, picture, email, email_verified, preferred_username]
  note: Standard, unmodified, plus the UGM-local unit_id claim above.
- vocabulary: OAuth 2.0 grant type URIs
  used_in: UGM ID
  terms: ['authorization_code', 'password', 'client_credentials', 'refresh_token', 'urn:ietf:params:oauth:grant-type:google_id_token', 'urn:ietf:params:oauth:grant-type:token-exchange']
  note: >-
    urn:ietf:params:oauth:grant-type:google_id_token is not an IETF-registered grant type despite
    the urn:ietf:params prefix; it is a vendor-shaped extension. token-exchange is RFC 8693.
- vocabulary: Dublin Core (oai_dc)
  used_in: Both OAI-PMH endpoints
  note: Also uketd_dc, didl, mets, rdf, oai_bibl on the repository; marcxml, oai_marc, nlm, rfc1807 on the journals.
- vocabulary: SAML 2.0 metadata
  used_in: Shibboleth IdP
  terms: ['urn:oasis:names:tc:SAML:2.0:nameid-format:transient', 'urn:mace:shibboleth:1.0:nameIdentifier']

