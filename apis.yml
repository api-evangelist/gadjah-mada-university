- aid: gadjah-mada-university:shibboleth-idp
  name: UGM Shibboleth SAML 2.0 Identity Provider
  description: >-
    UGM's own Shibboleth Identity Provider, entityID https://sso.ugm.ac.id/idp/shibboleth, publishing
    an unsigned SAML EntityDescriptor from the university's own host — retrieved live on 2026-09-01
    (200, 6379 bytes, application/xml) and saved to this repo. Advertises SAML 2.0, SAML 1.1 and the
    native Shibboleth 1.0 authn profile over HTTP-Redirect, HTTP-POST and HTTP-POST-SimpleSign, with
    SOAP artifact resolution, three single-logout bindings, and a separate AttributeAuthority-
    Descriptor exposing SAML 1.0 and SAML 2.0 SOAP AttributeQuery. Institution-operated by
    definition. Two findings are recorded honestly: shibmd:Scope is declared as "ac.id" — the whole
    Indonesian academic namespace — rather than "ugm.ac.id", and the entity is NOT present in the
    eduGAIN aggregate (10,616 entities checked 2026-09-01), so the IdP is self-published rather than
    inter-federated. It is also not a developer API: no application can obtain an assertion without
    being registered as a service provider.
  humanURL: https://sso.ugm.ac.id/
