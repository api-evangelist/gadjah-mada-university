aid: gadjah-mada-university
name: Gadjah Mada University
x-type: university
x-category: Public Research University
description: >-
  Gadjah Mada University (Universitas Gadjah Mada, UGM) is a public research university in
  Yogyakarta, Indonesia, founded in 1949 and the country's oldest and largest state university.
  Unusually for this cohort, UGM's programmable footprint is real and it is its own: the university
  operates and publishes a first-party OpenAPI 3.1.0 contract for UGM ID, its OAuth 2.0 / OpenID
  Connect authorization server at oauth.simaster.ugm.ac.id, complete with an OIDC Discovery
  document, an RFC 8414 authorization-server metadata document, PKCE, RFC 7662 introspection, RFC
  7009 revocation, RFC 8693 token exchange, a Swagger UI and a public health endpoint. Alongside it
  UGM runs its own Shibboleth SAML 2.0 Identity Provider, a CAS server, and two independent, fully
  functional OAI-PMH 2.0 endpoints — the EPrints institutional repository at repository.ugm.ac.id
  and the university-wide Open Journal Systems platform at journal.ugm.ac.id, whose articles carry
  DOIs under UGM's own Crossref prefix 10.22146 (member 9411). None of that is a vendor's contract
  running under UGM's name; every host is under ugm.ac.id and every specification describes itself
  as UGM's. What UGM does not have is a developer programme. There is no developer portal, no
  self-service client registration, no dynamic client registration, no documented route to a
  client_id, no changelog, no status page, no terms of service and no licence on any surface. There
  is no open data portal — data.ugm.ac.id returns a maintenance page — no public course, timetable
  or registrar API, and no research-computing service catalog. The main site's WordPress REST API
  is deliberately closed to anonymous callers, and the whole /.well-known/ path is blocked at the
  edge. The honest summary is a genuine engineering surface with no consumer-facing programme
  around it, plus three real registry and federation relationships recorded as facts about the
  institution rather than as contracts it wrote.
