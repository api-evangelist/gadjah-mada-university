x-coverage:
  state: covered
  reason: covered
  detail: >-
    Six institution-operated surfaces found and verified by live probe on 2026-09-01, and one of
    them is a genuine first-party contract: UGM publishes its own OpenAPI 3.1.0 document for UGM ID
    at https://oauth.simaster.ugm.ac.id/openapi.json (200, 19677 bytes, servers[] both under
    ugm.ac.id, info.title "UGM ID", written in Indonesian, no vendor named), served behind its own
    Swagger UI. Around it sit an OIDC Discovery document, an RFC 8414 metadata document, a public
    /health endpoint, a self-published Shibboleth SAML 2.0 IdP, a CAS server, and two independent
    OAI-PMH 2.0 endpoints — the EPrints repository and the OJS journal platform — both exercised
    through Identify, ListMetadataFormats, ListSets and ListRecords/ListIdentifiers with real data
    returned. Two registry relationships are recorded as facts about the institution rather than as
    its contracts: Crossref member 9411 with prefix 10.22146, and ROR 03ke6d638. One deployment,
    eLOK's Moodle Web Services, is recorded as a relationship with the contract left to Moodle. No
    vendor contract was found in this repo and none was added; nothing was removed. The absences
    are stated as findings, not gaps in the probe: data.ugm.ac.id returns HTTP 200 serving a
    "UGM - Maintenance" soft-404 so there is no open data portal, api.ugm.ac.id and hpc.ugm.ac.id do
    not resolve, no public course/timetable/registrar API exists, github.com/ugm-ac-id is a real but
    empty org with zero public repositories, ai.ugm.ac.id 502s, the main site's WordPress REST API
    returns a machine-readable 401 refusal, and the entire /.well-known/ path on ugm.ac.id is 403'd
    at the edge so the absence of security.txt cannot be distinguished from a block. Four of the
    twelve education-regime domain standards are evidenced against fetched artifacts: oai-pmh, saml,
    shibboleth and crossref. The 2026-06-03 profile recorded two surfaces and missed the OpenAPI,
    the journal platform, the SAML IdP and both registry memberships entirely.
  assessed: '2026-09-01'
  method: pipeline-university + live probe
  institution_surfaces: 6
  tenant_surfaces: 0
  registry_surfaces: 2
