x-attribution-note:
  date: '2026-09-01'
  summary: >-
    No misattribution was found in this repository and nothing was removed. The 2026-06-03 profile
    was thin rather than wrong: it recorded two institution-operated surfaces and missed four more,
    including UGM's own published OpenAPI. Every surface added on 2026-09-01 carries an x-operator
    settled before the artifact was saved. Only ONE contract is credited to UGM as authored — the
    UGM ID OpenAPI, which UGM publishes itself. The two OAI-PMH OpenAPIs are marked method:derived
    and are ours, not theirs. No vendor product specification (EPrints, OJS/PKP, Moodle) is held
    under this slug. Expect this repository's Kin Score to RISE, and unlike most of this cohort the
    rise is measuring the institution's own engineering.
