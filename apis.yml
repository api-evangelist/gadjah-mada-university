- aid: gadjah-mada-university:repository-oai-pmh
  name: UGM Institutional Repository OAI-PMH
  description: >-
    OAI-PMH 2.0 metadata harvesting endpoint for "repository civitas UGM", the institutional
    repository running EPrints 3.3.15 on the university's own host. Verified live on 2026-09-01 —
    Identify returns repositoryName "repository civitas UGM" and adminEmail library@ugm.ac.id with
    an earliest datestamp of 2014-01-06, ListMetadataFormats offers six prefixes (oai_dc, didl,
    mets, oai_bibl, rdf, uketd_dc), and ListIdentifiers returns 100 real identifiers in the first
    page. deletedRecord is "persistent", the strongest reversibility commitment the protocol offers.
    The software is EPrints; the deployment, host, content and administration are UGM's, so the
    endpoint is institution-operated even though the code is not UGM's. Two real defects: the
    HTTPS origin returns 403 from an edge filter while HTTP returns 200 — the pointers here are
    deliberately http:// for that reason — and metadataPolicy, dataPolicy and submissionPolicy are
    all left at the EPrints default "this server has not yet been fully configured" text, so a
    harvester is told to assume no rights are granted.
