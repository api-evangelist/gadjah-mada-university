- name: jwks-empty
  api: gadjah-mada-university:ugm-id
  operationId: getJwks
  request:
    method: GET
    url: https://oauth.simaster.ugm.ac.id/.well-known/jwks.json
    auth: none
  response:
    status: 200
    content_type: application/json
    body: |
      {"keys":[]}
  note: >-
    200 with no keys. RS256 is advertised for id_token signing but no verification key is published.

- name: token-invalid-client
  api: gadjah-mada-university:ugm-id
  operationId: getToken
  request:
    method: POST
    url: https://oauth.simaster.ugm.ac.id/oauth/token
    content_type: application/x-www-form-urlencoded
    body: grant_type=client_credentials
    auth: none
  response:
    status: 401
    content_type: application/json
    body: |
      {"error": "invalid_client", "error_description": "The client cannot authenticate with methods: ['client_secret_basic', 'client_secret_post']"}
  note: >-
    A correct RFC 6749 section 5.2 error object. Note the error_description leaks a Python list
    repr rather than a formatted string.

- name: protected-resource-unauthenticated
  api: gadjah-mada-university:ugm-id
  operationId: getMe
  request:
    method: GET
    url: https://oauth.simaster.ugm.ac.id/api/me
    auth: none
  response:
    status: 401
    content_type: text/html; charset=utf-8
    bytes: 4559
    body_excerpt: '<!DOCTYPE html><html lang="id"><head><title>401 · Unauthorized · UGM ID</title>'
  note: >-
    Correct status code, wrong media type for an API - the resource endpoints return a branded HTML
    page to an unauthenticated caller instead of a JSON error object. Identical behaviour on
    /user/me, /userinfo and /user/username/{username}.

- name: authenticated-resource-not-exercised
  api: gadjah-mada-university:ugm-id
  operationIds: [getMe, getUserMe, getUserByUsername, getUserInfo, introspectToken]
  status: not-exercised
  note: >-
