- name: health-check
  api: gadjah-mada-university:ugm-id
  operationId: healthCheck
  request:
    method: GET
    url: https://oauth.simaster.ugm.ac.id/health
    auth: none
  response:
    status: 200
    content_type: application/json
    body: |
      {"services":{"database":"up","redis":"up","simaster":"up"},"status":"ok","timestamp":1788294994,"version":"unknown"}
  note: >-
    Publicly reachable with no credentials. Reports downstream dependency health for the database,
    Redis and Simaster. `version` is the string "unknown", so the surface exposes liveness but not
    a build identifier.

