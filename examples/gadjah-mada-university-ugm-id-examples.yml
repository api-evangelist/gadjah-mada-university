    auth: none
  response:
    status: 200
    content_type: text/xml
    body_excerpt: |
      <Identify>
        <repositoryName>repository civitas UGM</repositoryName>
        <protocolVersion>2.0</protocolVersion>
        <adminEmail>library@ugm.ac.id</adminEmail>
        <earliestDatestamp>2014-01-06T06:46:00Z</earliestDatestamp>
        <deletedRecord>persistent</deletedRecord>
        <granularity>YYYY-MM-DDThh:mm:ssZ</granularity>
        ...
        <comment>This system is running eprints server software (EPrints 3.3.15)</comment>
      </Identify>
  note: >-
    The eprints description block also reveals that metadataPolicy, dataPolicy and submissionPolicy
    are all left at the EPrints default text ("No metadata policy defined. This server has not yet
    been fully configured."), which is a real governance gap on an otherwise working endpoint.

